{% extends "base.html" %}
{% block title %}New course{% endblock %}
{% block content %}
<div class="container py-5" style="max-width: 600px;">
  <h1 class="mb-4">Create a course</h1>
  <form method="POST" class="cnd-card p-4">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="mb-3">
      <label class="form-label">Title *</label>
      <input type="text" name="title" class="form-control" required>
    </div>
    <div class="mb-3">
      <label class="form-label">Language</label>
      <select name="language_id" class="form-select">
        {% for lang in languages %}<option value="{{ lang.id }}">{{ lang.name }}</option>{% endfor %}
      </select>
    </div>
    <div class="mb-3">
      <label class="form-label">Description</label>
      <textarea name="description" class="form-control" rows="3"></textarea>
    </div>
    <button type="submit" class="btn btn-cnd-primary">Create course</button>
  </form>
</div>
{% endblock %}
