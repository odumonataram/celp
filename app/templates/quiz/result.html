{% extends "base.html" %}
{% block title %}Results -- {{ quiz.title }}{% endblock %}
{% block content %}
<div class="container py-5 text-center" style="max-width: 520px;">
  <div class="cnd-card p-5">
    <h1 class="display-font">{{ attempt.score }}%</h1>
    <p class="text-muted">{{ correct_count }} out of {{ total }} correct</p>
    <p class="lang-chip d-inline-block">+{{ xp_earned }} XP earned</p>
    <div class="mt-4 d-flex gap-2 justify-content-center">
      <a href="{{ url_for('quiz.index') }}" class="btn btn-outline-cnd">Back to quizzes</a>
      <a href="{{ url_for('dashboard.index') }}" class="btn btn-cnd-primary">View dashboard</a>
    </div>
  </div>
</div>
{% endblock %}
